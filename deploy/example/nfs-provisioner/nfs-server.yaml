---
kind: Service
apiVersion: v1
metadata:
  name: nfs-server
  namespace: default
  labels:
    app: nfs-server
spec:
  type: ClusterIP  # use "LoadBalancer" to get a public ip
  selector:
    app: nfs-server
  ports:
    - name: tcp-2049
      port: 2049
      protocol: TCP
    - name: udp-111
      port: 111
      protocol: UDP
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: nfs-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      name: nfs-server
      labels:
        app: nfs-server
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 65534
        fsGroupChangePolicy: Always
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: nfs-server
          image: itsthenetwork/nfs-server-alpine:latest
          command:
            - sh
            - -c
            - syslogd && mkdir $(SHARED_DIRECTORY) && mount --bind /fuck $(SHARED_DIRECTORY);
              nohup /usr/bin/nfsd.sh &>log & sleep 1h
          env:
            - name: SHARED_DIRECTORY
              value: /exports
          volumeMounts:
            - mountPath: /exports
              name: nfs-vol
              readOnly: false
          securityContext:
            privileged: true
          ports:
            - name: tcp-2049
              containerPort: 2049
              protocol: TCP
            - name: udp-111
              containerPort: 111
              protocol: UDP
      volumes:
        - name: nfs-vol
          hostPath:
            path: /srv/nfs-vol  # modify this to specify another path to store nfs share data
            type: DirectoryOrCreate
